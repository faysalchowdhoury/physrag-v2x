services:
  redis:
    image: redis/redis-stack:7.2.0-v9
    ports:
      - "6379:6379"
      - "8001:8001"          # RedisInsight
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  gateway:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      PHYSRAG_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    command: uvicorn physrag.api.main:app --host 0.0.0.0 --port 8000

  spark-etl:
    build: .
    depends_on:
      - redis
    environment:
      PHYSRAG_REDIS_URL: redis://redis:6379/0
    # one-shot ETL: build the heterogeneous graph from the real NGSIM + IEEE-14 data
    command: python -c "import sys; sys.path.insert(0,'src'); from physrag.etl.spark_graph_builder import build_hetero_graph; g=build_hetero_graph(use_spark=True); print('hetero graph:', len(g.seg_ids), 'segments', g.bus_feats.shape[0], 'buses')"
    restart: "no"

  mock-inference:
    build: .
    environment:
      PHYSRAG_REDIS_URL: redis://redis:6379/0
    # lightweight mock VLM/PINN inference worker (CPU; real QLoRA path is GPU-gated)
    command: python -c "import sys,time; sys.path.insert(0,'src'); from physrag.rag.vlm_finetune import VLMDiagnoser; d=VLMDiagnoser(); print('mock VLM ready (mock=%s)' % d.mock); [time.sleep(3600) for _ in iter(int,1)]"
    restart: unless-stopped
