[build-system]
requires = ["setuptools>=64", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "physrag-v2x"
version = "0.1.0"
description = "Distributed Physics-Informed Multimodal GraphRAG for real-time traffic & grid anomaly diagnostics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Faysal Chowdhoury" }]
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "redis>=5.0", "httpx>=0.27"]
ml = ["torch>=2.1", "torch-geometric>=2.5", "peft>=0.10", "transformers>=4.40"]
spark = ["pyspark>=3.5"]
viz = ["matplotlib>=3.7", "seaborn>=0.13"]
cpp = ["pybind11>=2.11"]
dev = ["pytest>=7.4", "pybind11>=2.11"]
all = [
    "fastapi>=0.110", "uvicorn>=0.27", "redis>=5.0", "httpx>=0.27",
    "torch>=2.1", "torch-geometric>=2.5", "peft>=0.10", "transformers>=4.40",
    "pyspark>=3.5", "matplotlib>=3.7", "seaborn>=0.13", "pybind11>=2.11",
    "pytest>=7.4",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
